[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asciline"
version = "0.2.0"
description = "A high-performance, cross-platform real-time ASCII video rendering engine."
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "YusufB5" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
ytdlp = [
    "yt-dlp>=2026.08.19",
]

[project.scripts]
asciline = "stream_server:main"
asciline-play = "ascii_video_player2:main"
asgrabber = "asgrabber:main"

[tool.setuptools.data-files]
"asciline_assets" = ["index.html", "app.js", "style.css", "codec.js", "examples/quickstart.html"]
"asciline_assets/src" = ["src/asciline-player.js", "src/index.js"]

[tool.setuptools]
packages = ["asciline"]
py-modules = [
    "ascii_video_player2",
    "asgrabber",
    "codec",
    "compiler",
    "logo",
    "stream_server",
    "ytdl",
]
